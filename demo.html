*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--paper,#f4f3ed);color:var(--ink,#243b2e);font:16px/1.65 Arial,sans-serif}a{color:inherit}button,input,select,textarea{font:inherit}button,a,input,select,textarea,summary{touch-action:manipulation}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}a,button{overflow-wrap:anywhere}:focus-visible{outline:3px solid #aa5829;outline-offset:5px}[hidden]{display:none!important}.bar{background:#202622;color:#fff;padding:14px 20px;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar a{font-size:14px}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.brand{padding:26px 0;font:28px Georgia,serif;letter-spacing:-1px}.eyebrow{font:12px/1.5 Arial,sans-serif;text-transform:uppercase;letter-spacing:.14em}h1,h2,h3,p{margin-top:0}h1{font:clamp(46px,8vw,88px)/1.04 Georgia,serif;letter-spacing:-.05em;margin-bottom:24px}h2{font:clamp(32px,5vw,52px)/1.13 Georgia,serif;letter-spacing:-.04em}h3{font-size:21px;line-height:1.3}p{max-width:62ch}.lead{font-size:18px}.hero{padding:32px 0 60px}.split{display:grid;gap:40px;align-items:center}.button{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:15px 23px;text-decoration:none;font-weight:600;text-align:center;min-height:52px}.button:active{transform:translateY(2px)}.quiet{background:transparent;color:var(--ink)}.small{font-size:13px}.section{padding:64px 0;border-top:1px solid #aeb7a5}.grid{display:grid;gap:24px}.panel{padding:24px;background:var(--panel,#e7ebdf);border:1px solid #aeb7a5}.pill{font-size:12px;border:1px solid currentColor;border-radius:30px;padding:5px 12px;display:inline-block}.path{min-height:360px;background:#dbe2ca;border-radius:50% 50% 2px 2px;padding:70px 24px 28px;display:grid;gap:12px;max-width:440px;margin:auto;width:100%}.path div{background:#f9faf1;padding:15px 20px;border:1px solid #afbaa2;font:22px Georgia,serif}.path div:nth-child(2){transform:rotate(-4deg)}.path span{float:right;font:12px Arial,sans-serif}.align{--paper:#f4f3e9;--ink:#254333;--panel:#e5eadb}.align h1 em{font-weight:400;color:#52734a}.cols{display:grid;gap:24px}.formbox{max-width:660px;margin:auto}form{display:grid;gap:16px}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font:28px/1.3 Georgia,serif;margin-bottom:20px}label{display:grid;gap:7px;margin:14px 0}input,select,textarea{border:1px solid #75836f;border-radius:0;padding:13px;width:100%;min-width:0;background:#fff;color:#243b2e}textarea{min-height:140px;resize:vertical}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions .button{flex:1}progress{width:100%;accent-color:#254333;height:8px;margin-bottom:24px}dt{font-weight:bold;margin-top:16px}dd{margin:0;overflow-wrap:anywhere}.sticky{position:fixed;bottom:0;left:0;right:0;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid #aeb7a5;z-index:3}.sticky .button{width:100%}footer{padding:36px 20px 120px;font-size:13px;border-top:1px solid #aeb7a5}.forma{--paper:#eeedf5;--ink:#342652;--panel:#e0dced}.forma h1,.forma h2{font-family:Arial,sans-serif;font-weight:700}.forma h1 em{font-family:Georgia,serif;font-weight:400}.forma .brand{font:700 32px Arial,sans-serif}.interior{background:#fff;border:1px solid #b4aeca;box-shadow:12px 12px 0 #d1c9e2;padding:16px}.ui-top{display:flex;justify-content:space-between;font-size:12px;padding-bottom:16px;border-bottom:1px solid #d1c9e2}.ui-body{display:grid;grid-template-columns:65px 1fr;gap:12px;padding-top:18px}.lesson-list{font-size:11px;display:grid;align-content:start;gap:20px}.poster{background:#e3b6a2;aspect-ratio:1.1;display:grid;place-items:center;font:bold clamp(66px,10vw,110px)/1 Georgia,serif}.swatches{display:flex;gap:8px;margin-top:14px}.swatches i{height:23px;flex:1;background:#342652}.swatches i:nth-child(2){background:#e3b6a2}.swatches i:nth-child(3){background:#d1c9e2}details{border-top:1px solid #aea5bf;padding:18px 0}summary{cursor:pointer;font-weight:bold;min-height:44px}details p{margin:12px 0 0}.offer{background:#342652;color:#fff;padding:32px}.offer .button{background:#f1c6ad;color:#342652;border-color:#f1c6ad}.slot{font-size:14px;border:1px dashed currentColor;padding:8px;display:inline-block}.fieldnotes{--paper:#f5efdf;--ink:#384b38;--panel:#e7e6d5}.fieldnotes .brand{font-style:italic}.book{max-width:340px;aspect-ratio:4/5;margin:12px auto 24px;background:#d5ddbd;border:1px solid #8e9d77;box-shadow:9px 9px 0 #bdbfa8;padding:28px;border-left:14px solid #80916e;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-3deg)}.book strong{font:48px/1.1 Georgia,serif}.book .lines{height:80px;background:repeating-linear-gradient(transparent,transparent 24px,#a7b494 25px,#a7b494 26px)}.fieldnotes footer{padding-bottom:35px}.fieldnotes .hero{padding-top:24px}.benefits{padding-left:20px}.benefits li{padding:7px 0}.check{font:64px Georgia,serif}.skip{position:absolute;top:-100px;left:10px;z-index:10;background:white;color:black;padding:12px}.skip:focus{top:10px}@media(min-width:800px){.split{grid-template-columns:1.1fr 1fr;gap:70px}.grid,.cols{grid-template-columns:1fr 1fr}.hero{padding:60px 0 90px}.sticky{display:none}.section{padding:85px 0}.formbox{padding:40px}.fieldnotes .hero{padding-top:65px}footer{padding-bottom:36px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><a class="skip" href="#main">Skip to concept</a><div class="bar"><a href="index.html#work">← Back to portfolio</a><span>Fictional brand · Interactive design concept · No information is sent or saved</span></div><main id="main"><noscript><div class="wrap"><h1>Explore the design thinking</h1><p>The interactive concepts require JavaScript. Read the static case studies: <a href="align-case-study.html">Align</a>, <a href="forma-case-study.html">Forma</a>, <a href="fieldnotes-case-study.html">Fieldnotes</a>.</p></div></noscript></main>
<template id="align"><div class="wrap"><div class="brand">align<span aria-hidden="true">↗</span></div><section class="hero split"><div><p class="eyebrow">Business coaching for independent founders</p><h1>A clearer offer.<br>A more deliberate <em>next chapter.</em></h1><p class="lead">A space to work through the decisions behind your business — what matters, what fits, and what comes next.</p><a class="button" href="#application">Start the sample application <span aria-hidden="true">↗</span></a><p class="small">Explore the fit before a conversation. This is a fictional offer.</p></div><div class="path" role="img" aria-label="Coaching journey: reflect on where you are, focus on what matters, plan your next step"><div>01. Reflect <span>WHERE YOU ARE</span></div><div>02. Focus <span>WHAT MATTERS</span></div><div>03. Plan <span>YOUR NEXT STEP</span></div></div></section><section class="section"><p class="eyebrow">Start with fit</p><h2>Support for the decisions<br>you keep circling back to.</h2><div class="cols"><div><h3>This could fit if…</h3><ul><li>You are refining an offer or choosing a new direction.</li><li>You want space to question assumptions and set priorities.</li><li>You are prepared to turn the conversation into your own actions.</li></ul></div><div><h3>This is not for…</h3><ul><li>Done-for-you sales or business management.</li><li>A promise of revenue or guaranteed outcomes.</li><li>Emergency, mental-health or specialist professional support.</li></ul></div></div></section><section id="application" class="section"><div class="panel formbox"><p class="eyebrow">A little context first</p><h2>Let’s understand the fit.</h2><p class="small">Use sample details. Everything stays in this page and is cleared when you leave or reload.</p><form id="apply"><p id="step-label" aria-live="polite">Step 1 of 4 · Contact</p><progress id="progress" value="1" max="4" aria-label="Application progress"></progress><fieldset><legend tabindex="-1">How should we address you?</legend><label>Your name<input name="name" required maxlength="80" autocomplete="off"></label><label>Email<input name="email" type="email" required maxlength="254" autocomplete="off"></label></fieldset><fieldset hidden disabled><legend tabindex="-1">Where are you in your business?</legend><label>Current focus<select name="stage" required><option value="">Choose one</option><option>Shaping my first offer</option><option>Refining an existing offer</option><option>Choosing my next priority</option></select></label></fieldset><fieldset hidden disabled><legend tabindex="-1">What would you like to work through?</legend><label>Your main question<textarea name="focus" required minlength="10" maxlength="600"></textarea></label><p class="small">At least 10 characters. Please avoid sensitive information.</p></fieldset><fieldset hidden disabled><legend tabindex="-1">Review your sample application</legend><dl id="review"></dl><p class="small">Continuing opens a mock booking screen. Nothing is submitted.</p></fieldset><p id="apply-error" role="alert"></p><div class="actions"><button type="button" class="button quiet" id="previous" hidden>Back</button><button class="button" type="submit" id="next">Continue</button></div></form><div id="booking" tabindex="-1" hidden><p class="eyebrow">Application preview complete</p><h3>Choose a sample conversation window.</h3><p>This is a mock calendar. No appointment, email or calendar event will be created.</p><div class="actions"><button class="button quiet" data-window="Morning">Sample morning</button><button class="button quiet" data-window="Afternoon">Sample afternoon</button></div><p id="booking-status" role="status"></p></div></div></section></div><div class="sticky"><a class="button" href="#application">Start the sample application ↗</a></div></template>
<template id="forma"><div class="wrap"><div class="brand">forma<span aria-hidden="true">.</span></div><section class="hero split"><div><p class="eyebrow">Brand foundations for independent creators</p><h1>Your idea.<br>Your <em>point of view.</em></h1><p class="lead">Explore how a clear message, a considered visual language and a repeatable system can give your work a more coherent identity.</p><a class="button" href="#offer">Explore the course offer ↗</a><p class="small">Fictional course · Sample curriculum and interface</p></div><div class="interior" role="img" aria-label="Sample course interior showing three lessons, typography artwork and a colour palette"><div class="ui-top"><b>forma / classroom</b><span>SAMPLE UI</span></div><div class="ui-body"><div class="lesson-list"><span>01<br>Position</span><b>02<br>Visuals</b><span>03<br>System</span></div><div><div class="poster">Aa.</div><div class="swatches"><i></i><i></i><i></i></div><p class="small">02 / Give your idea a visual language</p></div></div></div></section><section class="section"><p class="eyebrow">Inside the concept</p><h2>Less guesswork.<br>A connected set of decisions.</h2><details><summary>01 — Find your position</summary><p>Explore the audience, the problem and the point of view behind an offer. Sample exercise: write a one-sentence positioning statement.</p></details><details><summary>02 — Build a visual language</summary><p>Connect type, colour and composition to the feeling of your brand. Sample exercise: assemble a small visual direction.</p></details><details><summary>03 — Make it repeatable</summary><p>Bring the choices into a simple system for everyday content. Sample exercise: define a reusable page structure.</p></details></section><section id="offer" class="section split"><div><p class="eyebrow">The offer, in one place</p><h2>A foundation<br>you can build on.</h2><p>The sample offer connects the lessons with practical prompts. Commercial terms must be confirmed before any real launch.</p></div><div class="offer"><h3>Brand foundations</h3><ul><li>Three sample curriculum modules</li><li>Positioning, visual direction and system prompts</li><li>A course interior concept</li></ul><p class="slot">[ADD confirmed course price]</p><p class="small">Access: [ADD confirmed access period and delivery details]</p><p class="small">Guarantee: [ADD confirmed guarantee or refund terms]</p><button class="button" id="buy">Preview checkout ↗</button><div id="checkout" tabindex="-1" hidden><h3>Checkout preview</h3><p>A real checkout would confirm the price, access and terms here. This concept takes no payment and creates no order.</p></div></div></section><section class="section"><h2>Before you decide.</h2><details><summary>Is this suitable for beginners?</summary><p>The sample curriculum starts with foundational decisions. [ADD verified prerequisites before offering this course.]</p></details><details><summary>What will I finish with?</summary><p>The concept includes practice prompts for positioning, a visual direction and a reusable structure. [ADD confirmed student deliverables.]</p></details><details><summary>Is there a refund policy?</summary><p>[ADD the actual refund policy and eligibility.] No guarantee is implied by this concept.</p></details><details><summary>Can I enrol here?</summary><p>No. This is an interactive portfolio concept, with a simulated checkout only.</p></details></section></div><div class="sticky"><a class="button" href="#offer">Explore the offer / preview checkout ↗</a></div></template>
<template id="fieldnotes"><div class="wrap"><div class="brand">fieldnotes <span aria-hidden="true">✳</span></div><section class="hero split"><div><p class="eyebrow">A planning guide for independent business owners</p><h1>Less noise.<br>One clear priority.</h1><p class="lead">Step back from the busy work. Make room to decide what your next 90 days are for.</p><ul class="benefits"><li>Choose a focus you can explain in one sentence.</li><li>Break the direction into practical milestones.</li><li>Make time to reflect before adding more.</li></ul><div id="optin-entry"><form id="optin"><label>Email<input name="email" type="email" autocomplete="off" required placeholder="you@example.com"></label><button class="button" type="submit">Preview guide request ↗</button></form><p class="small">Use a sample address. No email is sent, stored or added to a list.</p></div><div id="thanks" class="panel" tabindex="-1" hidden><span class="check" aria-hidden="true">✓</span><h2>A little space to think.</h2><p>That’s the opt-in preview. No email was sent and there is no downloadable guide in this concept.</p><button id="prompt-button" class="button">Try one sample prompt ↗</button><div id="prompt" tabindex="-1" hidden><h3>What deserves your attention?</h3><p>Write one sentence: “Over the next 90 days, I want to focus on ___ because ___.”</p></div></div></div><div class="book" role="img" aria-label="Sample guide cover titled Your next 90 days, with a lined planning area"><span class="eyebrow">Fieldnotes / sample guide</span><strong>Your next<br>90 days.</strong><div class="lines"></div><span class="small">A little structure.<br>A clearer direction.</span></div></section></div></template>
<script>
const routes={coaching:['align','Align — Coaching application concept'],course:['forma','Forma — Course sales concept'],lead:['fieldnotes','Fieldnotes — Guide opt-in concept']};const route=routes[new URLSearchParams(location.search).get('project')]||routes.coaching;document.body.className=route[0];document.title=route[1];document.getElementById('main').append(document.getElementById(route[0]).content.cloneNode(true));const footer=document.createElement('footer');footer.innerHTML='<div class="wrap">Independent design concept by Art Jhen Prix Guray. <a href="index.html#work">Back to the portfolio</a>.</div>';document.body.append(footer);const q=s=>document.querySelector(s);
if(route[0]==='align'){let step=0;const form=q('#apply'),sets=[...form.querySelectorAll('fieldset')],names=['Contact','Business focus','Your question','Review'];function show(){sets.forEach((s,i)=>{s.hidden=i!==step;s.disabled=i!==step});q('#step-label').textContent='Step '+(step+1)+' of 4 · '+names[step];q('#progress').value=step+1;q('#previous').hidden=step===0;q('#next').textContent=step===3?'Continue to mock booking':'Continue';q('#apply-error').textContent='';if(step===3){const dl=q('#review');dl.replaceChildren();[['name','Name'],['email','Email'],['stage','Business focus'],['focus','Main question']].forEach(([name,label])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=form.elements[name].value;dl.append(dt,dd)})}sets[step].querySelector('legend').focus()};q('#previous').addEventListener('click',()=>{step--;show()});form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const empty=[...sets[step].querySelectorAll('[required]')].find(el=>!el.value.trim()||(el.name==='focus'&&el.value.trim().length<10));if(empty){q('#apply-error').textContent='Please complete this question before continuing.';empty.focus();return}if(step<3){step++;show()}else{form.hidden=true;q('#booking').hidden=false;q('#booking').focus();q('.sticky').hidden=true;form.reset()}});document.querySelectorAll('[data-window]').forEach(b=>b.addEventListener('click',()=>{q('#booking-status').textContent=b.dataset.window+' selected in this preview. No actual appointment has been booked.'}))}
if(route[0]==='forma')q('#buy').addEventListener('click',()=>{q('#checkout').hidden=false;q('#checkout').focus()});
if(route[0]==='fieldnotes'){q('#optin').addEventListener('submit',e=>{e.preventDefault();if(!q('#optin').reportValidity())return;q('#optin').reset();q('#optin-entry').hidden=true;q('#thanks').hidden=false;q('#thanks').focus()});q('#prompt-button').addEventListener('click',()=>{q('#prompt-button').hidden=true;q('#prompt').hidden=false;q('#prompt').focus()})}
</script></body></html>
